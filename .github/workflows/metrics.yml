name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out metrics source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lowlighter/metrics
          ref: 65836723097537a54cd8eb90f61839426b4266b6
          path: .metrics-action
          persist-credentials: false
      - name: Bound metrics diagnostic retention
        run: python3 .github/scripts/prepare-metrics-action.py .metrics-action
      - name: Generate metrics
        uses: ./.metrics-action
        with:
          use_prebuilt_image: no
          token: ${{ secrets.METRICS_TOKEN }}
          user: ruddyscent
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Seoul
          filename: github-metrics.svg

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes

          plugin_isocalendar: yes
          # plugin_achievements: yes
          # plugin_achievements_threshold: C
          plugin_stars: yes
          plugin_followup: yes
